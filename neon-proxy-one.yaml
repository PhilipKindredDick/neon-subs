# ╔════════════════════════════════════════════════════════════════════╗
# ║  neon-proxy-one — NETRUNNER EDITION                                ║
# ║  Clash Verge / Mihomo profile • VLESS + Reality к GCP us-central1  ║
# ║                                                                    ║
# ║  Рулсеты от Loyalsoldier (apache-2.0) — обновляются раз в сутки    ║
# ║  Реклама/трекеры → REJECT                                          ║
# ║  RU-инфра (банки/госуслуги/маркетплейсы) → DIRECT                  ║
# ║  Всё остальное → через ротонду                                     ║
# ║                                                                    ║
# ║  ✨ Лейн & Пинг для бро • 20.05.2026                                ║
# ╚════════════════════════════════════════════════════════════════════╝

mixed-port: 7890
mode: rule
log-level: info
allow-lan: false
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.*
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "neon-proxy-one"
    type: vless
    server: 34.55.223.211
    port: 443
    uuid: 304c51f8-5e21-4eea-bdc0-4ebeb6cb811d
    network: tcp
    udp: false
    tls: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 1Ft_BCjUX8mvTZvdZXPgcUCipjNXVjzUnWfi9WjTLl8
      short-id: ce5ca552f4edc872

proxy-groups:
  - name: "🌐 Главная"
    type: select
    proxies:
      - neon-proxy-one
      - DIRECT

  - name: "🛡 Блок"
    type: select
    proxies:
      - REJECT
      - DIRECT

# ═══════════════════════════════════════════════════════════════════════
# RULE PROVIDERS — внешние списки от Loyalsoldier
# Качаются при первом запуске, кэшируются локально, обновляются раз в день
# ═══════════════════════════════════════════════════════════════════════
rule-providers:
  reject:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.yaml
    path: ./ruleset/loyalsoldier/reject.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.yaml
    path: ./ruleset/loyalsoldier/private.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.yaml
    path: ./ruleset/loyalsoldier/lancidr.yaml
    interval: 86400

  proxy-list:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.yaml
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.yaml
    path: ./ruleset/loyalsoldier/gfw.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.yaml
    path: ./ruleset/loyalsoldier/telegramcidr.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.yaml
    path: ./ruleset/loyalsoldier/google.yaml
    interval: 86400

# ═══════════════════════════════════════════════════════════════════════
# RULES — выполняются по порядку, первое совпадение побеждает
# ═══════════════════════════════════════════════════════════════════════
rules:
  # ─── Локалка и системные адреса ───
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT
  - GEOIP,LAN,DIRECT

  # ─── Proxy server IP — всегда напрямую, иначе TUN routing loop! ───
  - IP-CIDR,34.55.223.211/32,DIRECT,no-resolve

  # ─── Реклама и трекеры — в чёрный ящик ───
  - RULE-SET,reject,🛡 Блок

  # ─── Bootstrap fix: CDN для rule-providers всегда напрямую ───
  # (иначе Mihomo не может скачать рулсеты если прокси временно лежит)
  - DOMAIN-SUFFIX,raw.githubusercontent.com,DIRECT
  - DOMAIN-SUFFIX,cdn.jsdelivr.net,DIRECT

  # ─── RU-инфра (банки, госуслуги, маркетплейсы) — напрямую ───
