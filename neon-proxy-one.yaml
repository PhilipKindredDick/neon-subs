# ╔════════════════════════════════════════════════════════════════════╗
# ║  neon-proxy-one — NETRUNNER EDITION v3                             ║
# ║  Clash Verge / Mihomo profile • VLESS + Reality к GCP us-central1  ║
# ║                                                                    ║
# ║  Рулсеты от Loyalsoldier (GPL-3.0) — обновляются раз в сутки       ║
# ║  Реклама/трекеры → REJECT                                          ║
# ║  RU-инфра (банки/госуслуги/маркетплейсы) → DIRECT                  ║
# ║  Всё остальное → через ротонду                                     ║
# ║                                                                    ║
# ║  ✨ Лейн & Пинг для бро • v3 fix SNI 20.07.2026                    ║
# ║  v3: SNI microsoft -> icloud (уходим из-под возможного DPI)        ║
# ║  v2: rule-providers .yaml -> .txt через jsdelivr                   ║
# ╚════════════════════════════════════════════════════════════════════╝

mixed-port: 7890
mode: rule
log-level: info
allow-lan: false
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.*
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "neon-proxy-one"
    type: vless
    server: 34.55.223.211
    port: 443
    uuid: 304c51f8-5e21-4eea-bdc0-4ebeb6cb811d
    network: tcp
    udp: false
    tls: true
    flow: xtls-rprx-vision
    servername: www.icloud.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 1Ft_BCjUX8mvTZvdZXPgcUCipjNXVjzUnWfi9WjTLl8
      short-id: ce5ca552f4edc872

proxy-groups:
  - name: "🌐 Главная"
    type: select
    proxies:
      - neon-proxy-one
      - DIRECT

  - name: "🛡 Блок"
    type: select
    proxies:
      - REJECT
      - DIRECT

# ═══════════════════════════════════════════════════════════════════════
# RULE PROVIDERS — Loyalsoldier через jsdelivr CDN
# ═══════════════════════════════════════════════════════════════════════
rule-providers:
  reject:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/loyalsoldier/reject.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/loyalsoldier/private.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/loyalsoldier/lancidr.yaml
    interval: 86400

  proxy-list:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    path: ./ruleset/loyalsoldier/gfw.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
    path: ./ruleset/loyalsoldier/telegramcidr.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
    path: ./ruleset/loyalsoldier/google.yaml
    interval: 86400

