# ╔════════════════════════════════════════════════════════════════════╗
# ║  neon-proxy-one — NETRUNNER EDITION v5                              ║
# ║  Clash Verge / Mihomo profile • VLESS + Reality + XHTTP             ║
# ║                                                                     ║
# ║  Транспорт: xhttp (обёртка HTTP/2 — DPI-невидимка)                  ║
# ║  Fingerprint: random (каждый ClientHello уникальный)                ║
# ║  SNI: www.mozilla.org (свежий, без DPI-истории)                     ║
# ║                                                                     ║
# ║  Рулсеты Loyalsoldier через jsdelivr CDN                            ║
# ║  RU-инфра → DIRECT, реклама → REJECT, всё остальное → ротонда       ║
# ║                                                                     ║
# ║  ✨ Лейн & Пинг для бро                                             ║
# ║  v5: IP-миграция 34.55.223.211 → 34.55.45.96 (01.08.2026)           ║
# ║  v4: xhttp transport + random fp + mozilla SNI (23.07.2026)         ║
# ║  v3: SNI microsoft → icloud (20.07.2026)                            ║
# ║  v2: rule-providers .yaml → .txt через jsdelivr (20.07.2026)        ║
# ╚════════════════════════════════════════════════════════════════════╝

mixed-port: 7890
mode: rule
log-level: info
allow-lan: false
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.*
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "neon-proxy-one"
    type: vless
    server: 34.55.45.96
    port: 443
    uuid: 304c51f8-5e21-4eea-bdc0-4ebeb6cb811d
    network: xhttp
    tls: true
    servername: www.mozilla.org
    client-fingerprint: random
    reality-opts:
      public-key: 1Ft_BCjUX8mvTZvdZXPgcUCipjNXVjzUnWfi9WjTLl8
      short-id: ce5ca552f4edc872
    xhttp-opts:
      path: "/"
      mode: "auto"

proxy-groups:
  - name: "🌐 Главная"
    type: select
    proxies:
      - neon-proxy-one
      - DIRECT

  - name: "🛡 Блок"
    type: select
    proxies:
      - REJECT
      - DIRECT

# ═══════════════════════════════════════════════════════════════════════
# RULE PROVIDERS — Loyalsoldier через jsdelivr CDN
# ═══════════════════════════════════════════════════════════════════════
rule-providers:
  reject:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/loyalsoldier/reject.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/loyalsoldier/private.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/loyalsoldier/lancidr.yaml
    interval: 86400

  proxy-list:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    path: ./ruleset/loyalsoldier/gfw.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
    path: ./ruleset/loyalsoldier/telegramcidr.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
    path: ./ruleset/loyalsoldier/google.yaml
    interval: 86400

