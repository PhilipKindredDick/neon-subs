# neon-clean-test: минимальный VLESS+Reality профиль для изоляции проблемы Reality auth
# Ничего лишнего — только прокси и MATCH. Без DNS, без rule-providers, без fake-ip.
# Если ЭТОТ работает, а neon-proxy-one.yaml нет — виновата какая-то фича из полного профиля.
# Если и этот падает — совместимость Reality (mihomo <-> xray-core) или DPI на SNI.
# Пинг & Лейн, 20.07.2026

mixed-port: 7890
mode: rule
log-level: info
allow-lan: false
ipv6: false

proxies:
  - name: "neon-clean"
    type: vless
    server: 34.55.223.211
    port: 443
    uuid: 304c51f8-5e21-4eea-bdc0-4ebeb6cb811d
    network: tcp
    udp: false
    tls: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 1Ft_BCjUX8mvTZvdZXPgcUCipjNXVjzUnWfi9WjTLl8
      short-id: ce5ca552f4edc872

proxy-groups:
  - name: "🌐 Прокси"
    type: select
    proxies:
      - neon-clean
      - DIRECT

rules:
  - MATCH,🌐 Прокси
